[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stereo_matching"
version = "0.2.0"
authors = [
    { name = "shriarul5273" },
]
description = "A unified Python library for stereo inference, visualization, ONNX export, and quantization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
keywords = ["stereo-matching", "disparity-estimation", "depth-estimation", "computer-vision", "deep-learning", "pytorch"]
dependencies = [
    "torch>=2.9.0",
    "torchvision>=0.15",
    "Pillow>=9.0",
    "numpy>=1.24",
    "matplotlib>=3.6",
    "opencv-python>=4.8",
    "huggingface-hub>=0.16",
    "einops>=0.8.2",
    "timm>=0.9.1",
    "tqdm",
    "open3d"
]

[project.urls]
Homepage = "https://github.com/shriarul5273/stereo_matching"
Repository = "https://github.com/shriarul5273/stereo_matching"
Issues = "https://github.com/shriarul5273/stereo_matching/issues"

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "pytest>=7.0",
    "pytest-cov",
    "onnx>=1.14",
    "onnxruntime>=1.20",
    "ruff",
    "mypy>=1.10",
]
export = [
    "onnx>=1.14",
    "onnxruntime>=1.20",
]

[project.scripts]
stereo-matching = "stereo_matching.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: network-dependent pretrained-model tests, excluded by default (run with -m slow)",
]

[tool.ruff.lint]
# Keep Ruff's original default rule set explicit. New Ruff releases can add
# implicit rules, which would make unchanged code start failing CI.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Model packages self-register when imported, so these imports are deliberate.
"src/stereo_matching/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Type checking is initially advisory in CI while the existing annotation
# backlog is reduced. New code should still aim to pass this configuration.
